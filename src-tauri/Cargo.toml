[package]
name = "growbox-pro"
version = "0.4.0"
description = "GrowBox Pro — licensed Gulf social media post drafting with local AI"
authors = ["GrowBox"]
edition = "2021"

[lib]
name = "reach_optimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json", "blocking"] }
futures-util = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
once_cell = "1"
csv = "1.3"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
hex = "0.4"
urlencoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
