name: Build macOS DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: false
        default: "arm64"
        type: choice
        options: [arm64, x86_64]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "22"
  NODE_LTS_RELEASE: "v22.15.0"
  # Pin the llama.cpp release used for pre-built binaries.
  # Update this when a newer release is needed.
  LLAMA_RELEASE: "b9145"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            node_platform: darwin-arm64
            llama_asset: "macos-arm64"
          - arch: x86_64
            runner: macos-13
            rust_target: x86_64-apple-darwin
            node_platform: darwin-x64
            llama_asset: "macos-x64"

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install JS deps
        run: npm ci || npm install

      - name: Sync Playwright resources
        run: node scripts/sync-playwright-resource.mjs

      # ── Bundle macOS Node.js binary ──────────────────────────────────────────
      - name: Bundle Node.js ${{ env.NODE_LTS_RELEASE }} into resources/node/
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/node
          rm -f src-tauri/resources/node/node.exe
          NODE_URL="https://nodejs.org/dist/${NODE_LTS_RELEASE}/node-${NODE_LTS_RELEASE}-${{ matrix.node_platform }}.tar.gz"
          curl -fsSL "$NODE_URL" -o /tmp/node.tar.gz
          tar -xzf /tmp/node.tar.gz \
            --strip-components=2 \
            -C /tmp \
            "node-${NODE_LTS_RELEASE}-${{ matrix.node_platform }}/bin/node"
          mv /tmp/node src-tauri/resources/node/node
          chmod +x src-tauri/resources/node/node
          echo "Node: $(src-tauri/resources/node/node --version)"

      # ── Bundle macOS FFmpeg static binary ────────────────────────────────────
      - name: Bundle FFmpeg into resources/llama/
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/llama
          rm -f src-tauri/resources/llama/ffmpeg.exe
          curl -fsSL "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" \
            -o /tmp/ffmpeg.zip
          unzip -o /tmp/ffmpeg.zip ffmpeg -d /tmp/ffmpeg-release
          mv /tmp/ffmpeg-release/ffmpeg src-tauri/resources/llama/ffmpeg
          chmod +x src-tauri/resources/llama/ffmpeg
          echo "FFmpeg: $(src-tauri/resources/llama/ffmpeg -version 2>&1 | head -1)"

      # ── Remove Windows-only llama binaries ───────────────────────────────────
      - name: Strip Windows llama binaries
        run: rm -f src-tauri/resources/llama/*.exe src-tauri/resources/llama/*.dll

      # ── Download pre-built llama.cpp release ─────────────────────────────────
      # Using official GitHub releases instead of building from source:
      # - arm64: Metal GPU acceleration included
      # - x86_64: CPU-only (no Metal on Intel)
      # This reduces this step from ~25 minutes to ~30 seconds.
      - name: Cache llama.cpp pre-built binaries
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/llama
          key: llama-cpp-prebuilt-${{ env.LLAMA_RELEASE }}-${{ matrix.llama_asset }}-v1

      - name: Download llama.cpp ${{ env.LLAMA_RELEASE }} (${{ matrix.llama_asset }})
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ASSET="llama-${LLAMA_RELEASE}-bin-${{ matrix.llama_asset }}.tar.gz"
          URL="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_RELEASE}/${ASSET}"
          echo "Downloading ${URL}"
          curl -fsSL "$URL" -o /tmp/llama.tar.gz
          mkdir -p /tmp/llama-extracted
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama-extracted
          DEST="$GITHUB_WORKSPACE/src-tauri/resources/llama"
          # Copy binaries we need
          for BIN in llama-server llama-mtmd-cli; do
            SRC=$(find /tmp/llama-extracted -name "$BIN" -type f | head -1)
            if [ -n "$SRC" ]; then
              cp "$SRC" "$DEST/"
              chmod +x "$DEST/$BIN"
              echo "  Copied: $BIN"
            else
              echo "  WARNING: $BIN not found in release archive"
            fi
          done
          # Copy all dylibs and metallib
          find /tmp/llama-extracted -type f \( -name '*.dylib' -o -name '*.metallib' \) \
            -exec cp {} "$DEST/" \;
          # Fix @rpath to @loader_path so dylibs resolve inside .app bundle
          cd "$DEST"
          for f in llama-server llama-mtmd-cli *.dylib; do
            [ -f "$f" ] || continue
            otool -L "$f" 2>/dev/null | awk 'NR>1 {print $1}' | while read -r dep; do
              base=$(basename "$dep")
              if [ -f "$base" ] && [ "$dep" != "@loader_path/$base" ]; then
                install_name_tool -change "$dep" "@loader_path/$base" "$f" \
                  2>/dev/null || true
              fi
            done
            if [[ "$f" == *.dylib ]]; then
              install_name_tool -id "@loader_path/$f" "$f" 2>/dev/null || true
            fi
          done
          ls -lh "$DEST/"

      # ── Verify all required binaries ─────────────────────────────────────────
      - name: Verify bundled binaries
        run: |
          echo "=== resources/llama/ ===" && ls -lh src-tauri/resources/llama/
          echo "=== resources/node/ ===" && ls -lh src-tauri/resources/node/
          echo "=== Architectures ==="
          for f in src-tauri/resources/llama/llama-server \
                   src-tauri/resources/llama/llama-mtmd-cli \
                   src-tauri/resources/llama/ffmpeg \
                   src-tauri/resources/node/node; do
            [ -f "$f" ] && echo "$(file $f)" || echo "MISSING: $f"
          done
          echo "=== Required check ==="
          test -f src-tauri/resources/llama/llama-server   && echo "✓ llama-server"   || echo "✗ llama-server MISSING"
          test -f src-tauri/resources/llama/ffmpeg          && echo "✓ ffmpeg"          || echo "✗ ffmpeg MISSING"
          test -f src-tauri/resources/node/node             && echo "✓ node"             || echo "✗ node MISSING"

      # ── Tauri build ───────────────────────────────────────────────────────────
      - name: Build Tauri app (ad-hoc signed)
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --target ${{ matrix.rust_target }}

      # ── Upload ────────────────────────────────────────────────────────────────
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrowBox-Pro-macOS-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: false
