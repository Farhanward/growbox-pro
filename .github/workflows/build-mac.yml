name: Build macOS DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install JS deps
        run: npm ci || npm install

      - name: Cache llama.cpp build
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/llama
          key: llama-cpp-${{ runner.os }}-${{ runner.arch }}-static-metal-v1

      - name: Build llama.cpp from source (Metal + static)
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/llama
          git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama-src
          cd /tmp/llama-src
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build build --config Release -j --target llama-server
          # Copy the server binary + every dylib produced by the build (ggml,
          # llama, mtmd, etc.) so the app stays self-contained.
          cp build/bin/llama-server "$GITHUB_WORKSPACE/src-tauri/resources/llama/"
          find build -type f \( -name '*.dylib' -o -name 'default.metallib' \) \
            -exec cp {} "$GITHUB_WORKSPACE/src-tauri/resources/llama/" \;
          chmod +x "$GITHUB_WORKSPACE/src-tauri/resources/llama/llama-server"
          # Rewrite library load paths to be relative to the binary's folder so
          # the bundle works after install_name_tool moves files into the .app.
          cd "$GITHUB_WORKSPACE/src-tauri/resources/llama"
          for f in llama-server *.dylib; do
            [ -f "$f" ] || continue
            otool -L "$f" | awk 'NR>1 {print $1}' | while read -r dep; do
              base=$(basename "$dep")
              if [ -f "$base" ] && [ "$dep" != "@loader_path/$base" ]; then
                install_name_tool -change "$dep" "@loader_path/$base" "$f" 2>/dev/null || true
              fi
            done
            # Fix the dylib's own id too.
            if [[ "$f" == *.dylib ]]; then
              install_name_tool -id "@loader_path/$f" "$f" 2>/dev/null || true
            fi
          done
          ls -la

      - name: Verify llama-server bundled
        run: |
          test -f src-tauri/resources/llama/llama-server
          file src-tauri/resources/llama/llama-server
          ls -la src-tauri/resources/llama/

      - name: Build Tauri app (unsigned)
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Upload DMG
        uses: actions/upload-artifact@v5
        with:
          name: ReachOptimizer-macOS-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: false
