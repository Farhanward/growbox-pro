name: Build macOS DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install JS deps
        run: npm ci || npm install

      - name: Fetch llama.cpp prebuilt (Metal, arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/llama

          # Use gh api (authenticated, no rate-limit) to find the macos-arm64 zip
          # in the latest llama.cpp release.
          asset_url=$(gh api repos/ggml-org/llama.cpp/releases/latest \
            --jq '.assets[].browser_download_url' \
            | grep -E 'macos-arm64.*\.zip$' | head -1 || true)

          if [ -z "$asset_url" ]; then
            echo "::warning::No macos-arm64 zip in latest release; available assets:"
            gh api repos/ggml-org/llama.cpp/releases/latest --jq '.assets[].name' || true
            # Walk back through last 10 releases to find one with the asset.
            for tag in $(gh api repos/ggml-org/llama.cpp/releases --jq '.[].tag_name' | head -10); do
              asset_url=$(gh api "repos/ggml-org/llama.cpp/releases/tags/${tag}" \
                --jq '.assets[].browser_download_url' \
                | grep -E 'macos-arm64.*\.zip$' | head -1 || true)
              [ -n "$asset_url" ] && { echo "Using fallback tag: $tag"; break; }
            done
          fi

          test -n "$asset_url"
          echo "Downloading: $asset_url"
          curl -fL "$asset_url" -o /tmp/llama.zip
          unzip -q /tmp/llama.zip -d /tmp/llama-extracted

          find /tmp/llama-extracted -type f \
            \( -name 'llama-server' -o -name 'llama-cli' -o -name '*.dylib' \
               -o -name '*.metal' -o -name 'ggml-metal*.bin' \) \
            -exec cp {} src-tauri/resources/llama/ \;

          chmod +x src-tauri/resources/llama/llama-server src-tauri/resources/llama/llama-cli 2>/dev/null || true
          ls -la src-tauri/resources/llama/
          test -f src-tauri/resources/llama/llama-server

      - name: Build Tauri app (unsigned)
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Upload DMG
        uses: actions/upload-artifact@v5
        with:
          name: ReachOptimizer-macOS-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: false
